name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.pdf'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.pdf'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Windows Release + ASan)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install Conan and detect profile
        id: conan_setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $conanHome = Join-Path $env:RUNNER_TEMP ".conan2"
          $env:CONAN_HOME = $conanHome
          "CONAN_HOME=$conanHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install "conan>=2.0,<3.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          conan profile detect --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $profilePath = Join-Path $conanHome "profiles\default"
          Get-Content $profilePath
          $profileHash = (Get-FileHash -Path $profilePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "profile_hash=$profileHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache Conan packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: ${{ runner.temp }}\.conan2\p
          key: conan-${{ runner.os }}-${{ steps.conan_setup.outputs.profile_hash }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ steps.conan_setup.outputs.profile_hash }}-
            conan-${{ runner.os }}-

      - name: Install dependencies with Conan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          conan install . --output-folder=out --build=missing -s build_type=Release -s compiler.cppstd=23
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B out/build `
            "-DCMAKE_TOOLCHAIN_FILE=$PWD/out/build/generators/conan_toolchain.cmake" `
            "-DCMAKE_POLICY_DEFAULT_CMP0091=NEW" `
            "-DATM_ENABLE_ASAN=ON"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build AtmPlusSe and atm_tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build out/build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run CTest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compilerLine = Select-String -Path "out/build/CMakeFiles/*/CMakeCXXCompiler.cmake" -Pattern 'set\(CMAKE_CXX_COMPILER "([^"]+)"\)' | Select-Object -First 1
          if (-not $compilerLine) {
            throw "Could not determine CMAKE_CXX_COMPILER path for ASan runtime DLL."
          }
          $clDir = Split-Path $compilerLine.Matches[0].Groups[1].Value -Parent
          $asanDll = Join-Path $clDir "clang_rt.asan_dynamic-x86_64.dll"
          if (-not (Test-Path $asanDll)) {
            throw "Expected ASan runtime DLL not found at: $asanDll"
          }
          $env:PATH = "$clDir;$env:PATH"

          ctest --test-dir out/build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
